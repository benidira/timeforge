<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Castov</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 400px;
      height: 600px;
      background-color: #050505;
      color: #fafafa;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 14px;
      color: #a1a1aa;
    }
  </style>
</head>
<body>
  <div class="loading">Loading Castov Engine...</div>
  <iframe src="https://castov.com/tools" allow="clipboard-read; clipboard-write" title="Castov Tools"></iframe>
</body>
</html>
